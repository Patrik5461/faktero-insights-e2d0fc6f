// Detekcia jazdy pre Android. Jadro kaskády je v `core/` bez jedinej triedy
// z Androidu — tá istá logika ako na iOS a rovnaké testy, takže sa dá overiť
// bez zariadenia (`./gradlew :faktero-drive-detector:testDebugUnitTest`).
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "sk.faktero.drivedetector"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation fileTree(dir: 'src/main/libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Poloha a rozpoznávanie činnosti. `FusedLocationProvider` je jediný
    // rozumný zdroj polohy na Androide — surový `LocationManager` má na
    // pozadí neporovnateľne horšiu spotrebu.
    implementation "com.google.android.gms:play-services-location:21.3.0"
    testImplementation "junit:junit:$junitVersion"
}
