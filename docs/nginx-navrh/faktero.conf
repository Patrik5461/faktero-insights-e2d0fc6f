# Holá doména faktero.sk → www.faktero.sk (návrh 2026-10-31).
# Presmerúva sa len GET/HEAD na stránky. API, OAuth, .well-known a deploy
# webhook ostávajú na faktero.sk bez presmerovania: klienti API volajú
# https://faktero.sk/api/v1 (aj z dokumentácie) a pri presmerovaní by POST
# telo a hlavička Authorization nedošli; claude.ai/ChatGPT majú OAuth adresy
# na faktero.sk uložené z registrácie.
map "$host:$request_method:$uri" $faktero_na_www {
    default 0;
    "~^faktero\.sk:(GET|HEAD):/(api/|oauth/|\.well-known/|webhook$)" 0;
    "~^faktero\.sk:(GET|HEAD):" 1;
}

server {
    server_name faktero.sk www.faktero.sk;

    # Nech nginx neprezrádza svoju verziu v hlavičke Server ani na chybových stránkach.
    server_tokens off;

    # faktero.sk → www (pravidlá v mape $faktero_na_www hore).
    if ($faktero_na_www) {
        return 301 https://www.faktero.sk$request_uri;
    }

    # Bezpečnostné hlavičky. `always` znamená, že sa pošlú aj pri chybových
    # odpovediach (401, 500), nielen pri 200. Dedia sa aj do location blokov nižšie,
    # lebo ani jeden z nich nemá vlastný add_header — keby ho niekto doplnil,
    # musí si tieto riadky skopírovať k sebe, inak sa v tom bloku stratia.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mikrofón appka nepotrebuje; fotoaparát áno (skenovanie QR z bločkov)
    # a polohu tiež (jazdy), ale len na vlastnej stránke.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Baliť aj odpovede z appky (HTML, JSON serverových funkcií). Predvolene
    # nginx balí len vlastné súbory a len text/html; skripty balí už appka sama
    # (.br/.gz z buildu), tie sem nepatria dvakrát — nginx zbalenú odpoveď nechá tak.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/json application/javascript text/javascript application/xml text/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Bez týchto hlavičiek vidí appka ako klienta 127.0.0.1. Tatra banka
        # potom odmietne obnovu účtov (PSU-IP-Address is mandatory).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_connect_timeout 300;
        proxy_send_timeout 600;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 20M;
    }

    # Presná zhoda (`=`), nie prefix. Bez rovnítka sem padalo aj /webhooky
    # a /webhooky-logy, čiže stránky aplikácie končili na 404.
    location = /webhook {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/faktero.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faktero.sk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    # Ani na porte 80 neprezrádzať verziu nginx (hlavička Server, chybové stránky).
    server_tokens off;
    if ($host = www.faktero.sk) {
        return 301 https://$host$request_uri;
    }
    if ($host = faktero.sk) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name faktero.sk www.faktero.sk;
    return 404;
}
